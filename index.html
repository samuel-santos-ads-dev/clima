<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clima</title>
    <link rel="stylesheet" href="estilos/estilo.css">
    <link rel="stylesheet" href="estilos/mobile.css" media="screen and (max-width: 500px)">
    <link rel="shortcut icon" id="favicon" href="midias/faviconsun.ico" type="image/x-icon">
    <script src="https://kit.fontawesome.com/d9f9931f52.js" crossorigin="anonymous"></script>
</head>
<body onload="faviconDinamico()">

    <main id="conteiner">
        <form id="pesquisar">
            <i class="fa-solid fa-location-dot fa-flip"></i>

            <input type="search" name="nomecidade" id="nomecidade" placeholder="Buscar Cidade" autocomplete="on">

            <button type="submit">
                <i class="fa-solid fa-search fa-fade"></i>
            </button>
        </form>

        <section id="previsao" class="mostrar">
            <h1 id="titulo">Paço do Lumiar, BR</h1>

            <div id="informacoes">
                <div id="tempo">
                    <img id="iconetempo" src="	https://openweathermap.org/img/wn/04d@2x.png" alt="Icone de clima atual">

                    <div>
                        <p id="temperatura">32<sup> C°</sup></p>
                        <p id="descricaotempo">Nublado</p>
                    </div>
                </div>

                <div id="demaisinformacoes">
                    <div class="info">

                        <i id="tempmaxico" class="fa-solid fa-temperature-arrow-up fa-fade"></i>

                        <div>
                            <h2>Temp. Max</h2>
                            <p id="temperaturamax">32<sup>°C</sup></p>
                        </div>
                    </div>

                    <div class="info">

                        <i id="tempminico" class="fa-solid fa-temperature-arrow-down fa-fade"></i>

                        <div>
                            <h2>Temp. Min</h2>
                            <p id="temperaturamin">21<sup>°C</sup></p>
                        </div>
                    </div>

                    <div class="info">

                        <i id="umidadeico" class="fa-solid fa-droplet fa-fade"></i>

                        <div>
                            <h2>Umidade</h2>
                            <p id="umidade">75%</p>
                        </div>
                    </div>

                    <div class="info">

                        <i id="ventoico" class="fa-solid fa-wind fa-fade"></i>

                        <div>
                            <h2>Vento</h2>
                            <p id="vento">33 km/h</p>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <div id="alerta"></div>

    </main>

    <footer class="rodape">
        <p class="copyright">&copy;<span id="ano"></span> Samuel Santos</p>
    </footer>
    
    <script src="script.js"></script>
</body>
</html>
